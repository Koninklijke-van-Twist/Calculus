# Deploy van web/ naar sleutels.kvt.nl, zelfde lftp-spiegel als Kothar/Ktesios.
#
# Secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_DIR
# Verwacht: FTP_REMOTE_DIR=/var/www/html/calculus
# Tim zet het exacte pad. Een lege waarde of een pad dat niet onder
# /var/www/html/… ligt, stopt de job vóór lftp (scripts/guard-ftp-remote-dir.sh).
#
# sqlite, Excel-pakketten, uploads en cache-JSON blijven op de server.
# .htaccess en lege indexbestanden in data/, cache/ en uploads/ gaan wél mee,
# anders blijft de directory listing en de anonieme download open.
# lftp: het laatste passende patroon wint. Includes staan daarom ná de excludes.
# Die mappen worden niet gechmod buiten de spiegel: Kothar doet dat niet.
# web/auth.php en de root-.htaccess horen alleen op de server.

name: Deploy to FTP on master push

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: FTP remote dir guard
        run: bash tests/guard_ftp_remote_dir_test.sh

      - name: Runtime directories stay closed
        run: bash tests/protected_runtime_dirs_test.sh

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Refuse empty or unsafe FTP_REMOTE_DIR
        env:
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: bash scripts/guard-ftp-remote-dir.sh

      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          bash scripts/guard-ftp-remote-dir.sh
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          # TLS uit: gelijk aan de andere sleutels-FTP-servers.
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          mirror -R --delete \
            --exclude-glob .htaccess \
            --exclude-glob .htpasswd \
            --exclude-glob auth.php \
            --exclude-glob data/ \
            --exclude-glob data/** \
            --exclude-glob data/packages/ \
            --exclude-glob data/packages/** \
            --exclude-glob cache/ \
            --exclude-glob cache/** \
            --exclude-glob uploads/ \
            --exclude-glob uploads/** \
            --include-glob data/ \
            --include-glob data/.htaccess \
            --include-glob data/index.html \
            --include-glob data/index.php \
            --include-glob data/packages/ \
            --include-glob data/packages/.htaccess \
            --include-glob data/packages/index.html \
            --include-glob data/packages/index.php \
            --include-glob cache/ \
            --include-glob cache/.htaccess \
            --include-glob cache/index.html \
            --include-glob cache/index.php \
            --include-glob uploads/ \
            --include-glob uploads/.htaccess \
            --include-glob uploads/index.html \
            --include-glob uploads/index.php \
            ./web .

          bye
          EOF
